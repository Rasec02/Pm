name: app_tu_solution
description: "App Tu Solution: gestión de órdenes de reparación, inventario de repuestos e historial para el taller Tu Solution."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ">=3.47.7 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # Persistencia local (SQLite).
  # drift y drift_dev se mantienen en la MISMA línea de versión (2.28.x/2.29.x),
  # que es la que usa sqlite3 2.x junto con sqlite3_flutter_libs.
  drift: ">=2.28.0 <2.30.0"
  sqlite3_flutter_libs: ^0.5.24
  path_provider: ^2.1.4
  path: ^1.9.0

  # Estado y arquitectura (Riverpod 2.x: Notifier / AsyncNotifier).
  flutter_riverpod: ^2.6.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

  # Generación del código de Drift.
  build_runner: ^2.4.13
  drift_dev: ">=2.28.0 <2.30.0"

flutter:
  uses-material-design: true
